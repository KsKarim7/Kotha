services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      KOTHA_ASR_MODEL: ${KOTHA_ASR_MODEL:-/app/models/bn-tugstugi-medium-ct2}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${HF_HUB_CACHE_DIR:-${HOME}/.cache/huggingface/hub}:/root/.cache/huggingface/hub:ro
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      start_period: 600s
      retries: 3

volumes:
  pgdata:
