[project]
name = "kotha"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/api"]

[tool.ruff]
line-length = 100
src = ["services/api"]
extend-exclude = ["docs/blueprint"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
