[project]
name = "kotha"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/api"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs/blueprint"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
