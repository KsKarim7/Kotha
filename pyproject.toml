[project]
name = "kotha"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "silero-vad>=6.2.3",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jiwer>=4.0.0",
    "matplotlib>=3.11.2",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
gpu = [
    "nvidia-cublas-cu12>=12.9.3.13 ; sys_platform == 'linux'",
]

[tool.uv]
default-groups = ["dev", "gpu"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.uv.build-backend]
module-name = "kotha"
module-root = "services/api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["eval"]

[tool.ruff]
line-length = 100
src = ["services/api", "eval"]
extend-exclude = ["docs/blueprint"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
