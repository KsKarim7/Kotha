[project]
name = "kotha"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv.build-backend]
module-name = "kotha"
module-root = "services/api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["services/api"]
extend-exclude = ["docs/blueprint"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
